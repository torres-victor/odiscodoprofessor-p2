<div class="row">
    <div class="col-sm-12 col-md-6 col-lg-4 col-xl-3 col-xxl-2"
        *ngFor="let obj of lista">
        <img src="./Produtos/{{obj.codigo}}.jpg" class="card-img-top">
        <h5 class="card-title">{{obj.nome}}</h5>
        <div class="card-body">
            <div *ngIf="obj.valorPromo>0">
                de: R$ {{obj.valor}}<br>
                por: R$ {{obj.valorPromo}}<br>
            </div>
            <div *ngIf="obj.valorPromo==0">
                por: R$ {{obj.valor}}<br>
            </div>
            <button class="btn btn-outline-info"> ver +</button>
            <button class="btn btn-outline-success" *ngIf="obj.quantidade>0">
                comprar</button>
        </div>
    </div>
